<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    
    <form action="/registro" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" 
                    id="nombre" 
                    name="nombre"
                    placeholder="Ej: Luke"
                    mainlength="3"
                    maxlength="20">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="apellido">Apellido:</label><br>
                    <input type="text" id="apellido" name="apellido">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña:</label><br>
                <input type="password" id="password" name="password"></td>
            </tr>
            <tr>
                <td>
                    <label for="password_confirm">Confirmar Contraseña:</label><br>
                <input type="password" id="password_confirm" name="password_confirm">
            </td>
            </tr>
            <tr>
                <td>
                    <label for="edad">Edad:</label><br>
                    <input type="number" id="edad" name="edad">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="nivel">Nivel de fuerza:</label><br>
                    <input
                        type="range" 
                        id="nivel" 
                        name="nivel" 
                        min="10" 
                        max="100"
                        value="50"
                        step="5">
                </td>
            </tr>
            <tr>
                <td>
                    <p>Seleccione tu bando:</p>
                    <input type="radio" id="jedi" name="bando" value="jedi">
                    <label for="jedi">Jedi</label>
                    <input type="radio" id="sith" name="bando" value="sith">
                    <label for="sith">Sith</label>
                </td>
            </tr>
            <tr>
                <td>
                    <p>seleccione tus habilidades:</p>
                    <input 
                        type="checkbox" 
                        id="fuerza" n
                        ame="habilidades" 
                        value="fuerza">
                    <label for="fuerza">uso de la Fuerza</label><br>
                    <input 
                        type="checkbox" 
                        id="sable"
                        name="habilidades"
                        value="sable">
                    <label for="sable">Uso del sable</label><br>
                    <input 
                        type="checkbox" 
                        id="levitar"
                        name="habilidades"
                        value="levitar">
                    <label for="levitar">Levitar</label><br>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="planeta">Planeta de origen:</label><br>
                    <select id="planeta" name="planeta"required>
                        <option value="tatooine">
                            Tatooine
                        </option>

                        <option value="coruscant">
                            Coruscant
                        </option>
                        <option value="naboo">
                            Naboo
                            </option>
                    </select>
                </td>
                <td>
                    <label for="edad">Droide:</label><br>
                    <select id="Droide" name="Droide" multiple size="2">
                        <option value="">
                            Selecciona un droide
                        </option>

                        <option value="c3po">
                            C-3PO
                        </option>
                        <option value="r2d2">
                            R2-D2
                        </option>
                        <option value="bb8">
                            BB-8
                        </option>
                    </select>
                </td>
            </tr>
            <td>
                <fieldset>
                    <legend>Datos Generales</legend>
                    <label for="misiones">Misiones</label><br>
                    <input type="number" ide="misiones" name="misiones"><br>
                    <label for="vuelos">Vuelos</label><br>
                    <input type="number" id="vuelos" name="vuelos"><br>
                </fieldset>
            </td>
        </table>
        <button type="submit">Registrarse</button>
         <button type="reset">Reset</button>

    </form>
</body>
</html>
