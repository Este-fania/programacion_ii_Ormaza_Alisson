<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello CSS</title>
    <style>
        h2{
            color:rgba(111, 204, 247, 0.932);
        }
        p{
            color:rgba(111, 120, 247, 0.932);
        }
    </style>
    <link rel="stylesheet" href="01_hello_css.css">
</head>
<body>
    <h1>Maneras de incluir estilos CSS en un archivo HTML</h1>
    <h1 style="color:rgba(247, 111, 247, 0.932)"> Hello world con CSS - Tipo Inline</h1>
    <h2>Estilo CSS - interno</h2>
    <p> Esta es la manera de incluir estilos tipo interno, colocando los estilos en el head del html</p>
    <h3>Estilo CSS - externo</h3>
    <a href="01_hello_css.css">Se incluyo estilos a traves de un archivo externo</a>

    
</body>
</html>
